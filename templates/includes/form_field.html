{% load i18n %}<div class="{{ wrapper_class|default:'mb-3' }}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="form-check">
      {{ field }}
      <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}{% if extra_label %} {{ extra_label }}{% endif %}</label>
      {% if field.errors %}<div class="invalid-feedback d-block" id="id_{{ field.name }}_error">{{ field.errors|join:" " }}</div>{% endif %}
    </div>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.errors %}<div class="invalid-feedback d-block" id="id_{{ field.name }}_error">{{ field.errors|join:" " }}</div>{% endif %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% endif %}
</div>
