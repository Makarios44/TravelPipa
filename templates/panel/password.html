{% extends "panel/base.html" %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Alterar senha</h1><p class="sub">Use pelo menos 10 caracteres, misturando letras e números.</p></div></div>
<form method="post" class="card-p" style="max-width:480px" novalidate>
  {% csrf_token %}
  {% for field in form %}{% include "panel/_field.html" %}{% endfor %}
  <button class="btn btn-primary w-100" type="submit">Salvar nova senha</button>
</form>
{% endblock %}
